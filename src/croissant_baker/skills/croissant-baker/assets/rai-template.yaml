# RAI config template for `croissant-baker --rai-config <file>`.
#
# Copy this file, fill in what the dataset owner has actually told you, and
# delete every key you cannot answer. Blank and missing keys are dropped, so a
# short honest file beats a long speculative one. None of these values can be
# inferred from the data: each one is a claim the dataset owner is making.
#
# The key names below are the only ones the loader reads. A misspelled key is
# silently ignored, so keep them exactly as written.
#
# Where each section lands in the output:
#   ai_fairness             -> rai: properties on the dataset node
#   lineage.source_datasets -> prov:wasDerivedFrom
#   lineage.models          -> rai:usedBy
#   activities              -> prov:wasGeneratedBy (a list of prov:Activity)

# Free-text safety and fairness fields. Be specific; generic text is worse
# than an omitted key because it looks like documentation and is not.
ai_fairness:
  # rai:dataLimitations. Boundaries, known failure modes, uses to avoid.
  data_limitations: >
    REPLACE: what this dataset does not cover and must not be used for.

  # rai:dataBiases. Representational gaps, skews, annotator background.
  data_biases: >
    REPLACE: who and what is over- or under-represented, and why.

  # rai:personalSensitiveInformation. What sensitive data is present, the
  # basis for including it, the privacy measures applied, residual risk.
  personal_sensitive_information: >
    REPLACE: or delete this key if the dataset holds no personal data.

  # rai:dataUseCases. Intended tasks, and the evidence they are valid.
  data_use_cases: >
    REPLACE: the tasks this dataset was built and validated for.

  # rai:dataSocialImpact. Note the key name: `data_social_impact`.
  data_social_impact: >
    REPLACE: who benefits, who could be harmed, what mitigates the harm.

  # rai:hasSyntheticData. If true, document the generation run under
  # `activities` below.
  has_synthetic_data: false

lineage:
  # prov:wasDerivedFrom. `url` is required; the rest are optional and any
  # entry without a `url` is dropped.
  source_datasets:
    - url: https://example.org/source-dataset
      name: REPLACE
      organisation: REPLACE
      license: REPLACE

  # rai:usedBy. Models or assets that trained or evaluated on this dataset.
  # `url` is required. Leave the list empty if there are none.
  models: []

# Each entry becomes one prov:Activity. Document the steps that actually
# happened; delete the ones that did not.
activities:
  - id: ACT-001
    # One of: data_collection | data_annotation | data_preprocessing
    type: data_collection
    description: >
      REPLACE: how and where the raw data was gathered.
    # ISO 8601 dates, quoted so YAML keeps them as strings.
    start_at: "2020-01-01"
    end_at: "2024-12-31"
    # Only for data_collection. One or more of: surveys | interviews |
    # observations | experiments | web_scraping | crowdsourcing |
    # existing_datasets | simulations | other
    collection_types:
      - observations
    # Who or what performed the activity. `name` is required; an entry
    # without one is dropped. is_synthetic: true marks an automated agent.
    agents:
      - name: REPLACE
        url: https://example.org
        description: >
          REPLACE: the role this agent played.
        is_synthetic: false
    # Tools or systems used. `name` is required.
    platforms:
      - name: REPLACE
        description: >
          REPLACE: what this platform was used for.
