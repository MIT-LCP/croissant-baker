name: Post coverage comment

# A pull request from a fork runs with a read-only token, so "Run Tests" can
# only save the comment as an artifact. This workflow runs from the base
# repository once that one finishes and posts it. It deliberately never checks
# the contributor's code out:
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed

concurrency:
  # On workflow_run, github.ref is always the default branch, so group by the
  # pull request's branch instead. Otherwise one pull request cancels another.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# The job below states what it needs.
permissions: {}

jobs:
  post-comment:
    name: Post coverage comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      # Post the comment, and edit it on later runs.
      pull-requests: write
      # Download the comment artifact from the run that triggered this one.
      actions: read
      contents: read
    steps:
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
