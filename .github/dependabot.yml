version: 2
updates:
  # Keep GitHub Actions versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep Python dependencies current. The uv ecosystem updates
  # pyproject.toml and uv.lock together, so uv sync --locked still passes.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
